<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leads - Real Estate CRM</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="navbar navbar-dark sticky-top bg-dark flex-md-nowrap p-0 shadow">
        <a class="navbar-brand col-md-3 col-lg-2 me-0 px-3" href="#">RE CRM</a>
        <div class="w-100 d-flex justify-content-end align-items-center pe-3">
            <span class="text-light me-3 user-name-display"></span>
            <a class="btn btn-outline-light btn-sm" href="#" id="logout-btn">Sign out</a>
        </div>
    </header>

    <div class="container-fluid">
        <div class="row">
            <nav class="col-md-3 col-lg-2 d-md-block bg-light sidebar collapse">
                <div class="position-sticky pt-3">
                    <ul class="nav flex-column">
                        <li class="nav-item"><a class="nav-link" href="dashboard.html">Dashboard</a></li>
                        <li class="nav-item"><a class="nav-link active" href="leads.html">Leads</a></li>
                        <li class="nav-item"><a class="nav-link" href="properties.html">Properties</a></li>
                        <li class="nav-item"><a class="nav-link" href="bookings.html">Bookings</a></li>
                    </ul>
                </div>
            </nav>

            <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4">
                <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
                    <h1 class="h2">Leads</h1>
                    <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#leadModal" onclick="openLeadModal()">+ Add Lead</button>
                </div>

                <!-- Filters -->
                <div class="row mb-3">
                    <div class="col-md-4">
                        <input type="text" id="search-input" class="form-control" placeholder="Search by name, phone, email, code...">
                    </div>
                    <div class="col-md-3">
                        <select id="stage-filter" class="form-select">
                            <option value="">All Stages</option>
                            <option value="New">New</option>
                            <option value="Contacted">Contacted</option>
                            <option value="Site Visit">Site Visit</option>
                            <option value="Interested">Interested</option>
                            <option value="Negotiation">Negotiation</option>
                            <option value="Booked">Booked</option>
                            <option value="Lost">Lost</option>
                        </select>
                    </div>
                    <div class="col-md-2">
                        <button class="btn btn-secondary w-100" id="filter-btn">Filter</button>
                    </div>
                </div>

                <div id="loader" class="loader d-block">Loading...</div>
                
                <div class="table-responsive d-none" id="table-container">
                    <table class="table table-striped table-hover align-middle">
                        <thead class="table-light">
                            <tr>
                                <th>Code</th>
                                <th>Name</th>
                                <th>Contact</th>
                                <th>Requirement</th>
                                <th>Stage</th>
                                <th>Assigned To</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="leads-table"></tbody>
                    </table>
                    <div id="empty-state" class="empty-state d-none">No leads found.</div>
                </div>
            </main>
        </div>
    </div>

    <!-- Lead Form Modal -->
    <div class="modal fade" id="leadModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="leadModalLabel">Add/Edit Lead</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="lead-form">
                        <input type="hidden" id="lead-id">
                        <div class="mb-3">
                            <label class="form-label">Customer Name *</label>
                            <input type="text" class="form-control" id="customer_name" required>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Phone *</label>
                                <input type="text" class="form-control" id="phone" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Email</label>
                                <input type="email" class="form-control" id="email">
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Requirement</label>
                            <input type="text" class="form-control" id="requirement">
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Budget</label>
                                <input type="number" class="form-control" id="budget">
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Source</label>
                                <input type="text" class="form-control" id="lead_source">
                            </div>
                        </div>
                        <div class="mb-3" id="stage-container">
                            <label class="form-label">Stage</label>
                            <select class="form-select" id="stage">
                                <option value="New">New</option>
                                <option value="Contacted">Contacted</option>
                                <option value="Site Visit">Site Visit</option>
                                <option value="Interested">Interested</option>
                                <option value="Negotiation">Negotiation</option>
                                <option value="Booked">Booked</option>
                                <option value="Lost">Lost</option>
                            </select>
                        </div>
                        <div class="mb-3 admin-only" id="assign-container">
                            <label class="form-label">Assign To</label>
                            <select class="form-select" id="assigned_employee_id"></select>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">Save Lead</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- Duplicate Warning Modal -->
    <div class="modal fade" id="duplicateModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content border-warning">
                <div class="modal-header bg-warning text-dark">
                    <h5 class="modal-title">Possible Duplicate Found</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <p>A lead with this phone number or email already exists.</p>
                    <div class="card card-body bg-light">
                        <strong id="dup-name"></strong>
                        <span id="dup-contact"></span>
                        <span id="dup-code"></span>
                    </div>
                    <p class="mt-3">Do you still want to create this lead?</p>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-warning" id="force-create-btn">Create Anyway</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/api.js"></script>
    <script src="js/leads.js"></script>
</body>
</html>
